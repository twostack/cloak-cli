name: cloak_cli
description: "A command-line wallet for the TSL1_SP shielded pool: receive BSV, deposit it, pay people, and prove you did."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.1

executables:
  cloak:

dependencies:
  # the shielded side: keys, notes, invoices, payments, proofs, the journal
  libcloak:
    path: ../libcloak
  # the pool itself: the protocol messages, the deposit and withdrawal
  # builders, the parameter plans
  tstokenlib:
    path: ../tstokenlib
  # the transparent side: BEEF in, UTXOs, signing, broadcast, the header chain
  libspiffy:
    path: ../libspiffy
  # the pipe to the coordinator
  ricochet:
    path: ../ricochet-dart-client
  dart_libp2p: ^2.0.0
  # the header store libspiffy keeps, opened here so it persists in the
  # wallet directory rather than in memory
  isar: ^3.1.0+1
  # the message type libspiffy's coordinator is told
  dactor: ^1.3.0

  args: ^2.4.2
  dartsv: ^3.1.0
  convert: ^3.1.2
  crypto: ^3.0.6
  cryptography: ^2.7.0
  logging: ^1.2.0
  path: ^1.8.3
  yaml: ^3.1.2

dev_dependencies:
  lints: ^2.0.0
  test: ^1.21.0
  # block headers mined in the suite, for the header chain libspiffy validates
  spiffynode: ^1.1.0
  # the coordinator, for the end-to-end run on localnet only. A wallet does
  # not depend on the server it talks to; its test suite does, because the
  # only way to show the two agree is to run one against the other.
  pool_coordinator:
    path: ../pool-coordinator
